<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { padding: 8px 16px; font: inherit; cursor: pointer; }
    #contributor-student-id { margin-top: 16px; font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Team Contribution</h1>

  <button id="load-contributor" type="button">Show Contributor</button>
  <p id="contributor-student-id"></p>

  <p><a href="index.html">Back to Task Manager</a></p>

  <script>
    document.getElementById('load-contributor').addEventListener('click', async () => {
      const output = document.getElementById('contributor-student-id');
      try {
        const response = await fetch('contribution.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        output.textContent = `Contributor Student ID: ${data.contributorStudentId}`;
      } catch (error) {
        output.textContent = `Could not load contributor: ${error.message}`;
      }
    });
  </script>
</body>
</html>
